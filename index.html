        if (mengeIdx < 0) continue;
        var val = row[b.col + mengeIdx];

      }

      leafRows.push({
        rowIndex: r, markt: String(markt).trim(),

  // ==========================================================================
  // Phase 1: Masterprodukt-Clustering
  // ==========================================================================
  function buildClusters(leafRows) {
    var exactGroups = new Map();
    leafRows.forEach(function (row) {
      var norm = transliterate(row.artikel);
      if (!exactGroups.has(norm)) exactGroups.set(norm, { originals: new Map(), owgwg: new Map() });
      var g = exactGroups.get(norm);
      if (!g.originals.has(row.artikel)) g.originals.set(row.artikel, { count: 0, nrs: new Set() });
      var o = g.originals.get(row.artikel);
      o.count += 1;
      if (row.artikelnummer) o.nrs.add(row.artikelnummer);
      var key = row.owg + "||" + row.wg;
      g.owgwg.set(key, (g.owgwg.get(key) || 0) + 1);
    });

    var normNames = Array.from(exactGroups.keys());
    var buckets = new Map();
    normNames.forEach(function (n) {
      var key = n.slice(0, 3);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(n);
    });

    var parent = new Map(normNames.map(function (n) { return [n, n]; }));
    function find(x) {
      while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); }
      return x;
    }
    function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); }

    var SIM_THRESHOLD = 0.86;
    var excludedByWeight = [];
    buckets.forEach(function (list) {
      for (var i = 0; i < list.length; i++) {
        for (var j = i + 1; j < list.length; j++) {
          if (list[i] === list[j]) continue;
          var sim = similarity(list[i], list[j]);
          if (sim < SIM_THRESHOLD) continue;
          var qa = extractTrailingQuantity(list[i]), qb = extractTrailingQuantity(list[j]);
          if (qa && qb && qa.value !== qb.value) {
            excludedByWeight.push({ a: list[i], b: list[j], sim: Math.round(sim * 100) / 100 });
            continue;
          }
          union(list[i], list[j]);
        }
      }
    });

    var merged = new Map();
    normNames.forEach(function (n) {
      var root = find(n);
      if (!merged.has(root)) merged.set(root, { originals: new Map(), owgwg: new Map(), normVariants: new Set() });
      var target = merged.get(root);
      var src = exactGroups.get(n);
      target.normVariants.add(n);
      src.originals.forEach(function (info, o) {
        if (!target.originals.has(o)) target.originals.set(o, { count: 0, nrs: new Set() });
        var t = target.originals.get(o);
        t.count += info.count;
        info.nrs.forEach(function (nr) { t.nrs.add(nr); });
      });
      src.owgwg.forEach(function (c, k) { target.owgwg.set(k, (target.owgwg.get(k) || 0) + c); });
    });

    var candidates = [];
    var id = 0;
    merged.forEach(function (g) {
      var originalsSorted = Array.from(g.originals.entries()).sort(function (a, b) { return b[1].count - a[1].count; });
      var owgwgSorted = Array.from(g.owgwg.entries()).sort(function (a, b) { return b[1] - a[1]; });
      var hasSpellingVariants = originalsSorted.length > 1;
      var hasOwgWgConflict = owgwgSorted.length > 1;
      if (!hasSpellingVariants && !hasOwgWgConflict) return;

      var suggName = originalsSorted[0][0];
      var suggKey = owgwgSorted[0][0];
      var suggParts = suggKey.split("||"), suggOwg = suggParts[0], suggWg = suggParts[1];

      var conflictType = "SPELLING";
      if (hasSpellingVariants && hasOwgWgConflict) conflictType = "BOTH";
      else if (hasOwgWgConflict) conflictType = "OWGWG";

      var accepted = conflictType === "OWGWG";

      candidates.push({
        id: id++,
        variants: originalsSorted.map(function (e) { return { name: e[0], count: e[1].count, nrs: Array.from(e[1].nrs) }; }),
        owgwgOptions: owgwgSorted.map(function (e) { var p = e[0].split("||"); return { owg: p[0], wg: p[1], count: e[1] }; }),
        suggestedName: suggName, suggestedOwg: suggOwg, suggestedWg: suggWg,
        conflictType: conflictType, accepted: accepted,
        editedName: suggName, editedOwg: suggOwg, editedWg: suggWg
      });
    });

    candidates.sort(function (a, b) {
      var totalA = a.variants.reduce(function (s, v) { return s + v.count; }, 0);
      var totalB = b.variants.reduce(function (s, v) { return s + v.count; }, 0);
      return totalB - totalA;
    });

    return { candidates: candidates, totalDistinct: normNames.length, totalClustersAfterMerge: merged.size, excludedByWeight: excludedByWeight };
  }

  // ==========================================================================
  // Export: bereinigte Zuordnung + Entscheidungen als .xlsx
  // ==========================================================================
  function exportXlsx(leafRows, candidates) {
    var nameOverride = new Map(), owgWgOverride = new Map();
    candidates.forEach(function (c) {
      if (!c.accepted) return;
      c.variants.forEach(function (v) {
        nameOverride.set(v.name, c.editedName);

      });
    });

    var bereinigungHeader = ["Originalbezeichnung", "Oberwarengruppe (Original)", "Warengruppe (Original)", "Masterprodukt (bereinigt)", "Oberwarengruppe (final)", "Warengruppe (final)", "GTIN"];
    var bereinigungRows = leafRows.map(function (r) {
      var finalName = nameOverride.get(r.artikel) || r.artikel;
      var ow = owgWgOverride.get(r.artikel);
      return [r.artikel, r.owg, r.wg, finalName, ow ? ow.owg : r.owg, ow ? ow.wg : r.wg, r.gtin != null ? r.gtin : ""];
    });

    var entscheidungenHeader = ["Paar-Schlüssel", "Varianten (Original)", "Konflikttyp", "Übernommen", "Zielprodukt", "Ziel-Oberwarengruppe", "Ziel-Warengruppe", "Gespeichert am"];
    var now = new Date();
    var timestamp = now.toISOString().slice(0, 19).replace("T", " ");
    var entscheidungenRows = candidates.map(function (c) {
      return [
        c.variants.map(function (v) { return v.name; }).join("||"),
        c.variants.map(function (v) { return v.name + " (" + v.count + ")"; }).join(" / "),
        c.conflictType, c.accepted ? "JA" : "NEIN", c.editedName, c.editedOwg, c.editedWg, timestamp
      ];
    });

    var wb = XLSX.utils.book_new();
    var ws1 = XLSX.utils.aoa_to_sheet([bereinigungHeader].concat(bereinigungRows));
    var ws2 = XLSX.utils.aoa_to_sheet([entscheidungenHeader].concat(entscheidungenRows));
    ws1["!cols"] = [{ wch: 32 }, { wch: 24 }, { wch: 24 }, { wch: 32 }, { wch: 24 }, { wch: 24 }, { wch: 14 }];
    ws2["!cols"] = [{ wch: 40 }, { wch: 45 }, { wch: 12 }, { wch: 11 }, { wch: 30 }, { wch: 24 }, { wch: 24 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, ws1, "Masterprodukte");
    XLSX.utils.book_append_sheet(wb, ws2, "Produktentscheidungen");

    var out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    var blob = new Blob([out], { type: "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "Bereinigung_Phase1.xlsx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

                h("td", null, h("input", {className:"small-input", value:r.targetWg || "", onChange:function(e){updateMasterRow(r.key,{targetWg:e.target.value});}})),
                h("td", null, cxEl("button", "text-xs font-semibold px-2 py-1 rounded border border-stone-300 bg-white", {onClick:function(){resetMasterRow(r.key);}}, ["Original"] ))
              ]);
            }))
          ])
        ]),
        cxEl("div", "mt-4 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-900", null, ["Beispiel: Cappuccino Groß aus TK-Kleingebäck nach GASTRONOMIE MARKTKÜCHE / HEIßGETRÄNKE verschieben und speichern. Beim nächsten SAP-Upload bleibt die SAP-Zeile im Original erhalten, Forecast und Planung verwenden aber automatisch die gespeicherte Master-Zuordnung."])
      ]));
    }

    children.push(cxEl("div", "mt-12 pt-4 border-t border-stone-300 text-xs text-stone-400", { key: "footer" }, [
      "V3 Basis: SAP-Import + Google-Drive-Lernbasis + persistente Stammdaten/Produktzuordnung. Nächster Schritt: Sortimentsauswahl je Markt/Abteilung/KW und danach Forecast."
    ]));

    return cxEl("div", "min-h-screen bg-stone-100 text-stone-900 font-sans", null, [
      cxEl("div", "max-w-5xl mx-auto px-4 py-8", { key: "inner" }, children)
    ]);
  }

  document.getElementById("root").setAttribute("data-mounted", "true");
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
